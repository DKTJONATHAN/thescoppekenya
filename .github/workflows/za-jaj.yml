name: Jaj — Opinion column

# Mon + Thu Nairobi clock. Dispatcher can still call this.
on:
  schedule:
    - cron: "25 8,14 * * 1,4"  # 11:25 / 17:25 EAT Mon+Thu
  workflow_call:
    inputs:
      max_articles:
        type: string
        required: false
        default: "1"
      source_category:
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      max_articles:
        description: "Max opinion pieces this run"
        required: false
        default: "1"
      source_category:
        description: "Source category (blank = all non-opinions)"
        required: false
        default: ""

concurrency:
  group: zandani-desk-za-jaj
  cancel-in-progress: false

permissions:
  contents: write

env:
  DEFAULT_BRANCH: main
  POSTS_DIR: content/posts
  MEMORY_FILE: .github/memory_opinions.json
  TZ: Africa/Nairobi

jobs:
  generate-and-publish:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.DEFAULT_BRANCH }}
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai

      - name: Write opinion pieces
        env:
          GEMINI_WRITE_KEY: ${{ secrets.GEMINI_WRITE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY1: ${{ secrets.GEMINI_API_KEY1 }}
          POSTS_DIR: ${{ env.POSTS_DIR }}
          MEMORY_FILE: ${{ env.MEMORY_FILE }}
          MAX_ARTICLES: ${{ inputs.max_articles || '1' }}
          SOURCE_CATEGORY: ${{ inputs.source_category || '' }}
        run: |
          if [ -f scripts/jaj_columnist.py ]; then
            python scripts/jaj_columnist.py
          else
            echo "scripts/jaj_columnist.py missing"
            exit 1
          fi

      - name: Voice, SEO and Kenya-first gate
        run: python scripts/finish_desk.py

      - name: Commit history and new posts
        run: |
          git config user.name  "Za Ndani"
          git config user.email "bot@zandani.co.ke"
          git add -A "${MEMORY_FILE}" content/posts || true
          if git diff --cached --quiet; then
            echo "No article or memory changes to commit"
            exit 0
          fi
          git commit -m "content: Jaj opinion column"
          git pull --rebase origin "${DEFAULT_BRANCH}" || git pull origin "${DEFAULT_BRANCH}" --no-rebase || true
          git push origin HEAD:"${DEFAULT_BRANCH}"
