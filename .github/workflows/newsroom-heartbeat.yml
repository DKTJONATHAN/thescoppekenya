name: Newsroom heartbeat

# Backup clock. Dispatcher owns the Nairobi desk schedule; this pokes it
# every 15 minutes so dropped GitHub crons still catch up. Also pokes
# scheduler, evening-brief and sitemaps when those slots are due.
#
# Required secret: ACTIONS_GITHUB_TOKEN (preferred) or PERSONAL_GITHUB_TOKEN
#   classic: repo + workflow
#   fine-grained: Contents R/W, Actions R/W, Metadata R

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: newsroom-heartbeat
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  poke:
    runs-on: ubuntu-22.04
    steps:
      - name: Poke dispatcher and due support workflows (Africa/Nairobi clock)
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_GITHUB_TOKEN || secrets.PERSONAL_GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::ACTIONS_GITHUB_TOKEN (or PERSONAL_GITHUB_TOKEN) missing — cannot start other workflows"
            exit 1
          fi

          EAT_H=$(TZ=Africa/Nairobi date +%H)
          EAT_M=$(TZ=Africa/Nairobi date +%M)
          EAT_DOW=$(TZ=Africa/Nairobi date +%u)
          EAT_NOW=$(TZ=Africa/Nairobi date '+%Y-%m-%d %H:%M %Z')
          H=$((10#$EAT_H))
          M=$((10#$EAT_M))
          NOW_MIN=$((H * 60 + M))
          echo "Heartbeat EAT: $EAT_NOW (dow=$EAT_DOW)"

          LOOKBACK=25
          due() {
            local th=$((10#$1)) tm=$((10#$2))
            local t=$((th * 60 + tm))
            local d=$((NOW_MIN - t))
            if [ "$d" -lt 0 ]; then d=$((d + 1440)); fi
            [ "$d" -ge 0 ] && [ "$d" -le "$LOOKBACK" ]
          }

          run_wf() {
            local wf=$1
            echo "→ gh workflow run $wf"
            if gh workflow run "$wf" --repo "$GH_REPO"; then
              echo "  started $wf"
            else
              echo "::warning::failed to start $wf"
            fi
          }

          if [ "$M" -lt 12 ]; then
            run_wf "scheduler.yml"
          fi

          if due 19 7; then
            run_wf "evening-brief.yml"
          fi

          if due 6 20 || due 12 20 || due 18 20 || due 0 20; then
            run_wf "submit-sitemaps.yml"
          fi

          if [ "$H" -lt 6 ]; then
            echo "Before 06:00 EAT — desks skipped"
            exit 0
          fi

          # Dispatcher is the Nairobi clock. Poke it every heartbeat so
          # dropped GitHub crons still catch up (12h lookback + slot ledger).
          run_wf "writer-dispatcher.yml"

          echo "Heartbeat done at $EAT_NOW"
