name: Facebook Auto-Post with AI

on:
  push:
    branches: [main]
    paths:
      - 'content/posts/**.md'
  workflow_dispatch:
    inputs:
      force_latest:
        description: 'Post the newest article even if already blasted'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: facebook-blast-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post-to-facebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 20
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai

      - name: Wait for deploy
        run: |
          echo "Waiting 45s for deploy..."
          sleep 45

      - name: Detect posts and publish to Facebook
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_WRITE_KEY: ${{ secrets.GEMINI_WRITE_KEY }}
          GEMINI_API_KEY1: ${{ secrets.GEMINI_API_KEY1 }}
          FORCE_LATEST: ${{ github.event.inputs.force_latest || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -e
          if [ -z "$FACEBOOK_PAGE_ID" ] || [ -z "$FACEBOOK_PAGE_TOKEN" ]; then
            echo "Facebook credentials not set, skipping"
            exit 0
          fi
          if [ -z "$GEMINI_API_KEY" ] && [ -z "$GEMINI_WRITE_KEY" ] && [ -z "$GEMINI_API_KEY1" ]; then
            echo "No Gemini keys set, skipping"
            exit 0
          fi

          CHANGED=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            CHANGED=$(ls -1t content/posts/*.md 2>/dev/null | head -3 || true)
          else
            if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
              CHANGED=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- 'content/posts/' | grep '\.md$' || true)
            fi
            if [ -z "$CHANGED" ]; then
              CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'content/posts/' 2>/dev/null | grep '\.md$' || true)
            fi
            if [ -z "$CHANGED" ]; then
              CHANGED=$(git log -1 --name-only --pretty=format: -- 'content/posts/' | grep '\.md$' || true)
            fi
          fi

          if [ -z "$CHANGED" ]; then
            echo "No post changes detected"
            exit 0
          fi

          export CHANGED_FILES="$CHANGED"
          echo "Candidates:"
          echo "$CHANGED_FILES"

          python3 << 'PY'
          import hashlib, json, os, re, time
          from pathlib import Path
          import requests
          from google import genai
          from google.genai import types

          SITE = "https://zandani.co.ke"
          MEM = Path(".github/memory_facebook_blast.json")
          IMG = Path("temp_fb_post_image.jpg")
          MODELS = ["gemini-2.5-flash", "gemini-2.0-flash", "gemini-3-flash-preview", "gemini-1.5-flash"]
          MAX_N = 3

          page_id = os.environ["FACEBOOK_PAGE_ID"]
          token = os.environ["FACEBOOK_PAGE_TOKEN"]
          force = os.environ.get("FORCE_LATEST", "false").lower() == "true"
          keys = [k for k in (os.environ.get("GEMINI_WRITE_KEY"), os.environ.get("GEMINI_API_KEY"), os.environ.get("GEMINI_API_KEY1")) if k]
          key_i = 0
          client = genai.Client(api_key=keys[key_i])

          def rotate():
              global key_i, client
              key_i = (key_i + 1) % len(keys)
              client = genai.Client(api_key=keys[key_i])

          def load_mem():
              if MEM.exists():
                  try:
                      d = json.loads(MEM.read_text(encoding="utf-8"))
                      return {"posted": d if isinstance(d, list) else d.get("posted", [])}
                  except Exception:
                      pass
              return {"posted": []}

          def save_mem(m):
              MEM.parent.mkdir(parents=True, exist_ok=True)
              m["posted"] = list(m.get("posted", []))[-400:]
              MEM.write_text(json.dumps(m, indent=2), encoding="utf-8")

          def field(content, name, default=""):
              m = re.search(rf'^{name}:\s*["\']?(.*?)["\']?\s*$', content, re.M)
              return (m.group(1).strip() if m else default).strip()

          def snippet(content, n=400):
              parts = re.split(r"^---\s*$", content, maxsplit=2, flags=re.M)
              body = parts[-1] if len(parts) >= 3 else content
              body = re.sub(r"[#>*_`\[\]()]", " ", body)
              body = re.sub(r"\s+", " ", body).strip()
              return body[:n]

          def gen_caption(title, author, excerpt, category, snip):
              prompt = (
                  "You are the social media manager for Za Ndani (zandani.co.ke), a Kenyan news site.\n"
                  "Write ONE Facebook post caption.\n\n"
                  f"Title: {title}\nAuthor: {author}\nCategory: {category}\nExcerpt: {excerpt}\nSnippet: {snip}\n\n"
                  "Rules:\n"
                  "- Strong hook first (question or clear news angle). No generic Breaking news.\n"
                  "- Max 2 short paragraphs, then CTA that full story link is in the comments.\n"
                  "- 2-3 emojis only. 2-4 hashtags at end including #Kenya.\n"
                  "- No URLs. No em/en dashes. No spill the tea / juice / popcorn spam.\n"
                  "- Clear Kenyan English. Output ONLY the caption."
              )
              for model in MODELS:
                  for _ in range(len(keys)):
                      try:
                          r = client.models.generate_content(
                              model=model,
                              contents=prompt,
                              config=types.GenerateContentConfig(temperature=0.85),
                          )
                          t = (r.text or "").strip()
                          if t:
                              print(f"Gemini OK [{model}]")
                              return t
                      except Exception as e:
                          print(f"Gemini error [{model}]: {e}")
                          rotate()
                          if any(x in str(e).lower() for x in ("429", "quota", "rate", "exhausted", "unavailable", "overloaded", "timeout")):
                              time.sleep(10)
                              continue
                          break
              return None

          def clean(t):
              t = (t or "").replace("\u2014", "-").replace("\u2013", "-")
              t = re.sub(r"https?://\S+", "", t)
              return t.strip()

          def phash(slug, title):
              return hashlib.md5(f"{slug}|{title}".encode()).hexdigest()

          def live_ok(url):
              for i in range(6):
                  try:
                      r = requests.get(url, timeout=12, allow_redirects=True)
                      if r.status_code == 200 and len(r.text) > 500:
                          return True
                  except Exception as e:
                      print(f"live check {i+1}: {e}")
                  time.sleep(8)
              return False

          def fb_post(caption, image_url):
              has_img = False
              if image_url.startswith("http"):
                  try:
                      r = requests.get(image_url, timeout=20)
                      r.raise_for_status()
                      IMG.write_bytes(r.content)
                      has_img = True
                  except Exception as e:
                      print(f"img fail: {e}")
              result = {}
              post_id = None
              if has_img:
                  with IMG.open("rb") as fh:
                      result = requests.post(
                          f"https://graph.facebook.com/v21.0/{page_id}/photos",
                          data={"message": caption, "access_token": token},
                          files={"source": fh},
                          timeout=60,
                      ).json()
                  post_id = result.get("post_id") or result.get("id")
                  if post_id and "_" not in str(post_id):
                      post_id = f"{page_id}_{post_id}"
              else:
                  result = requests.post(
                      f"https://graph.facebook.com/v21.0/{page_id}/feed",
                      data={"message": caption, "access_token": token},
                      timeout=40,
                  ).json()
                  post_id = result.get("id")
              if IMG.exists():
                  IMG.unlink(missing_ok=True)
              return post_id, result

          def comment(post_id, msg):
              return requests.post(
                  f"https://graph.facebook.com/v21.0/{post_id}/comments",
                  data={"message": msg, "access_token": token},
                  timeout=30,
              ).json()

          mem = load_mem()
          done = set(mem.get("posted", []))
          paths = [p.strip() for p in os.environ.get("CHANGED_FILES", "").splitlines() if p.strip().endswith(".md") and Path(p.strip()).exists()]
          paths = sorted(paths, key=lambda p: Path(p).stat().st_mtime, reverse=True)

          n = 0
          for path in paths:
              if n >= MAX_N:
                  break
              content = Path(path).read_text(encoding="utf-8")
              slug = field(content, "slug") or Path(path).stem
              if re.match(r"^\d{4}-\d{2}-\d{2}-", slug) and not field(content, "slug"):
                  slug = re.sub(r"^\d{4}-\d{2}-\d{2}-", "", slug)
              title = field(content, "title", "Latest from Za Ndani")
              author = field(content, "author", "Za Ndani")
              excerpt = field(content, "excerpt") or field(content, "description") or "Read the full story on Za Ndani."
              category = field(content, "category", "News")
              image_url = field(content, "image")
              url = f"{SITE}/article/{slug}"
              h = phash(slug, title)
              if h in done and not force:
                  print(f"Skip already blasted: {slug}")
                  continue
              print(f"Processing: {title} -> {url}")
              if not live_ok(url):
                  print(f"Not live yet, posting anyway: {url}")
              cap = gen_caption(title, author, excerpt, category, snippet(content))
              if not cap:
                  cap = f"{title}\n\n{excerpt}\n\nFull story is in the comments. #Kenya #News"
              cap = clean(cap)
              post_id, api = fb_post(cap, image_url)
              print(f"FB: {api}")
              if not post_id:
                  print(f"FAILED {slug}")
                  continue
              time.sleep(8)
              msg = f"Full story by {author}:\n{url}"
              cres = comment(post_id, msg)
              print(f"Comment: {cres}")
              if "error" in cres:
                  alts = []
                  if "_" in str(post_id):
                      alts.append(str(post_id).split("_", 1)[-1])
                  else:
                      alts.append(f"{page_id}_{post_id}")
                  for alt in alts:
                      time.sleep(3)
                      cres = comment(alt, msg)
                      print(f"Comment retry {alt}: {cres}")
                      if "error" not in cres:
                          break
              done.add(h)
              mem["posted"] = list(done)
              n += 1
              print(f"Published {slug}")
              time.sleep(5)

          save_mem(mem)
          print(f"Done. Published {n} post(s).")
          PY

      - name: Persist Facebook blast memory
        if: always()
        run: |
          if [ ! -f .github/memory_facebook_blast.json ]; then
            echo "No memory file"
            exit 0
          fi
          git config user.name "Za Ndani"
          git config user.email "bot@zandani.co.ke"
          git add .github/memory_facebook_blast.json
          git diff --staged --quiet && echo "No memory changes" && exit 0
          git commit -m "chore(facebook): update blast memory [skip ci]" || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true
