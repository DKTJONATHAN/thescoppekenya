name: Ops | Label workflows (author + source)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  label:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/label_workflows.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: label workflows with author and source site"
          commit_author: "Za Ndani <bot@zandani.co.ke>"
          file_pattern: ".github/workflows/*.yml"
