name: Entertainment hourly trigger (disabled)

# Disabled: Mutheu entertainment runs 4x daily Kenya daytime on za Entertainment.yml.
# Keep for emergency manual dispatch only.

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Mutheu Ann - Entertainment Scraper
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "Firing za Entertainment.yml on main"
          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/za%20Entertainment.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Dispatch sent"
