name: Patch category schedules

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply schedule patches
        run: python scripts/patch_category_schedules.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "schedule: align category crons to EAT staggered slots"
          commit_author: "Za Ndani <bot@zandani.co.ke>"
          file_pattern: ".github/workflows/*.yml"
