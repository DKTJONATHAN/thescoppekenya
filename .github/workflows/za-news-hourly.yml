name: Celestine hourly trigger (disabled)

# Disabled: za-news.yml now runs hourly 06:00–23:00 EAT directly.
# Keep this file only for emergency manual dispatch.

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Celestine Nzioka - News Scraper
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "Firing za-news.yml on main"
          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/za-news.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Dispatch sent"
