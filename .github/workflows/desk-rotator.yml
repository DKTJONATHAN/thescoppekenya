name: Desk Rotator

# Independent dispatcher. All timing decisions use East Africa Time (EAT).
# GitHub cron is UTC-only; logic below converts to Africa/Nairobi before acting.
#
# EAT schedule:
# - Every hour 06:00–23:00 EAT → fire za-news, za-ghafla, za-mpasho
# - Every even EAT hour 06:00–22:00 → fire one random desk from the pool
#   (no repeats until the pool is exhausted, then reset and cycle again)

on:
  schedule:
    # Minute 17 every UTC hour → minute 17 every EAT hour (UTC+3).
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "hourly = news/ghafla/mpasho only | rotate = one random desk | both = default"
        required: false
        default: "both"
      force_desk:
        description: "Optional: force one rotation desk (e.g. entertainment, sports). Empty = random."
        required: false
        default: ""

concurrency:
  group: desk-rotator
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  TZ: Africa/Nairobi
  DEFAULT_BRANCH: main
  ROTATION_LEDGER: .github/desk_rotation_ledger.txt

jobs:
  rotate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ env.DEFAULT_BRANCH }}
          token: ${{ secrets.ACTIONS_GITHUB_TOKEN || secrets.PERSONAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Decide and fire workflows (EAT clock)
        env:
          TZ: Africa/Nairobi
          GH_TOKEN: ${{ secrets.ACTIONS_GITHUB_TOKEN || secrets.PERSONAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'both' }}
          FORCE_DESK: ${{ github.event_name == 'workflow_dispatch' && inputs.force_desk || '' }}
        run: |
          set -euo pipefail

          # Force EAT for every date(1) call in this job
          export TZ=Africa/Nairobi

          EAT_H=$(date +%H)
          EAT_M=$(date +%M)
          EAT_DAY=$(date +%F)
          EAT_NOW=$(date '+%Y-%m-%d %H:%M %Z')
          H=$((10#$EAT_H))
          M=$((10#$EAT_M))

          echo "Desk Rotator | EAT $EAT_NOW | mode=${MODE}"

          # Desk hours in EAT (same window as other za-* desks)
          # Outside this window, scheduled runs no-op (manual dispatch still works).
          IN_DESK_HOURS=0
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            IN_DESK_HOURS=1
          elif [ "$H" -ge 6 ] && [ "$H" -le 23 ]; then
            IN_DESK_HOURS=1
          fi

          if [ "$IN_DESK_HOURS" -ne 1 ]; then
            echo "Outside EAT desk hours (06:00–23:59). Skipping."
            {
              echo "## Desk Rotator"
              echo "**EAT:** $EAT_NOW"
              echo "Outside desk hours — no workflows fired."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Rotation pool (excludes news/g: news / ghafla / mpasho)
          POOL=(
            entertainment
            africa
            agriculture
            business
            lifestyle
            opinions
            sports
            technology
            diano
            jaj
          )

          desk_to_workflow() {
            case "$1" in
              news) echo "za-news.yml" ;;
              ghafla) echo "za-ghafla.yml" ;;
              mpasho) echo "za-mpasho.yml" ;;
              entertainment) echo "za-entertainment.yml" ;;
              africa) echo "za-africa.yml" ;;
              agriculture) echo "za-agriculture.yml" ;;
              business) echo "za-business.yml" ;;
              lifestyle) echo "za-lifestyle.yml" ;;
              opinions) echo "za-opinions.yml" ;;
              sports) echo "za-sports.yml" ;;
              technology) echo "za-technology.yml" ;;
              diano) echo "za-diano.yml" ;;
              jaj) echo "za-jaj.yml" ;;
              *) echo "" ;;
            esac
          }

          fire_workflow() {
            local desk="$1"
            local wf
            wf=$(desk_to_workflow "$desk")
            if [ -z "$wf" ]; then
              echo "Unknown desk: $desk" >&2
              return 1
            fi
            echo "→ Triggering $wf ($desk) [EAT $EAT_NOW]"
            gh workflow run "$wf" --ref "$DEFAULT_BRANCH" \
              && echo "  fired $wf" \
              || echo "  WARN: failed to fire $wf" >&2
          }

          mkdir -p "$(dirname "$ROTATION_LEDGER")"
          [ -f "$ROTATION_LEDGER" ] || touch "$ROTATION_LEDGER"

          FIRED_HOURLY=()
          FIRED_ROTATE=""

          # --- Every EAT hour: news + ghafla + mpasho ---
          if [ "$MODE" = "hourly" ] || [ "$MODE" = "both" ]; then
            for d in news ghafla mpasho; do
              fire_workflow "$d"
              FIRED_HOURLY+=("$d")
            done
          fi

          # --- Every 2 EAT hours (even hour): one random unused desk ---
          # Even EAT hours: 06, 08, 10, 12, 14, 16, 18, 20, 22
          DO_ROTATE=0
          if [ "$MODE" = "rotate" ]; then
            DO_ROTATE=1
          elif [ "$MODE" = "both" ] && [ $((H % 2)) -eq 0 ]; then
            DO_ROTATE=1
          fi

          if [ "$DO_ROTATE" -eq 1 ]; then
            REMAINING=()
            for d in "${POOL[@]}"; do
              if ! grep -qxF "$d" "$ROTATION_LEDGER" 2>/dev/null; then
                REMAINING+=("$d")
              fi
            done

            if [ "${#REMAINING[@]}" -eq 0 ]; then
              echo "Rotation cycle complete at EAT $EAT_NOW — resetting ledger"
              : > "$ROTATION_LEDGER"
              REMAINING=("${POOL[@]}")
            fi

            PICK=""
            if [ -n "${FORCE_DESK:-}" ] && [ "$FORCE_DESK" != "null" ]; then
              desk=$(echo "$FORCE_DESK" | tr '[:upper:]' '[:lower:]' | sed 's/\.yml$//; s/^za-//; s/^za //')
              PICK="$desk"
            else
              IDX=$((RANDOM % ${#REMAINING[@]}))
              PICK="${REMAINING[$IDX]}"
            fi

            VALID=0
            for d in "${POOL[@]}"; do
              [ "$d" = "$PICK" ] && VALID=1 && break
            done
            if [ "$VALID" -ne 1 ]; then
              echo "Invalid rotation desk: $PICK" >&2
              exit 1
            fi

            fire_workflow "$PICK"
            FIRED_ROTATE="$PICK"

            if ! grep -qxF "$PICK" "$ROTATION_LEDGER" 2>/dev/null; then
              echo "$PICK" >> "$ROTATION_LEDGER"
            fi

            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$ROTATION_LEDGER"
            if ! git diff --staged --quiet; then
              git commit -m "chore: desk rotation ledger (+$PICK) EAT $EAT_DAY ${EAT_H}:${EAT_M}"
              git pull --rebase origin "$DEFAULT_BRANCH" || true
              git push origin HEAD:"$DEFAULT_BRANCH" || true
            fi
          else
            echo "Skip rotation (EAT hour $H is odd — next even EAT hour)"
          fi

          {
            echo "## Desk Rotator (EAT)"
            echo "**EAT now:** $EAT_NOW"
            echo "**Mode:** $MODE"
            echo "**EAT hour:** $H (even = rotation slot)"
            if [ "${#FIRED_HOURLY[@]}" -gt 0 ]; then
              echo "**Hourly fired:** ${FIRED_HOURLY[*]}"
            else
              echo "**Hourly fired:** (none this run)"
            fi
            if [ -n "$FIRED_ROTATE" ]; then
              echo "**Rotation fired:** $FIRED_ROTATE"
              echo "**Ledger:**"
              echo '```'
              cat "$ROTATION_LEDGER" || true
              echo '```'
            else
              echo "**Rotation fired:** (skipped)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
