name: Retarget writers to Kenya / East Africa / Africa

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/retarget-kenya-sources.yml

permissions:
  contents: write

jobs:
  retarget:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: main

      - name: Rewrite source URLs in writer workflows
        run: |
          python3 << 'PY'
          from pathlib import Path

          root = Path(".github/workflows")
          # Keep Ghafla + Mpasho as first-class Kenyan entertainment sources.
          # Only retarget true international leftovers.
          replacements = [
              # Mutheu Ann: drop EW.com international entertainment
              ("https://ew.com/", "https://www.pulselive.co.ke/articles/entertainment"),
              ("https://ew.com", "https://www.pulselive.co.ke/articles/entertainment"),
              ("'ew.com'", "'pulselive.co.ke'"),
              ('"ew.com"', '"pulselive.co.ke"'),
              ("SOURCE_DOMAIN  = 'ew.com'", "SOURCE_DOMAIN  = 'pulselive.co.ke'"),
              ("Entertainment Weekly", "Pulse Live"),
              ("EW.com", "Pulse Live"),
              # Sports: BBC world football -> Nation Kenya sports
              ("https://www.bbc.com/sport/football", "https://nation.africa/kenya/sports"),
              ("SOURCE_DOMAIN  = 'bbc.com'", "SOURCE_DOMAIN  = 'nation.africa'"),
              ("BBC Sport", "Nation Sport"),
              # Football365 British gossip -> Kenya sports
              ("https://www.football365.com/all-the-news", "https://nation.africa/kenya/sports"),
              ("https://www.football365.com", "https://nation.africa"),
              ("Football365", "Nation Sport"),
              ("'category: \"Global News\"'", "'category: \"Sports\"'"),
              ('category: "Global News"', 'category: "Sports"'),
          ]

          changed = []
          for path in sorted(root.glob("*.yml")):
              if path.name in ("za ghafla.yml", "za mpasho.yml"):
                  print(f"skip protected {path}")
                  continue
              text = path.read_text(encoding="utf-8", errors="replace")
              orig = text
              for a, b in replacements:
                  text = text.replace(a, b)
              if text != orig:
                  path.write_text(text, encoding="utf-8")
                  changed.append(str(path))
                  print(f"updated {path}")
          print("files_changed", len(changed))
          PY

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_author: "Za Ndani <bot@zandani.co.ke>"
          commit_message: "content: retarget international leftovers only; keep Ghafla + Mpasho"
          branch: main
          file_pattern: ".github/workflows/*.yml"
