name: One-shot strip writer schedules

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  strip:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Strip schedules
        run: python scripts/strip_writer_schedules.py
      - name: Commit
        run: |
          git config user.name "Za Ndani"
          git config user.email "bot@zandani.co.ke"
          git add .github/workflows/*.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "chore: remove schedule from content writers (dispatcher owns Kenya time)"
          git pull --rebase origin main || true
          git push origin HEAD:main
