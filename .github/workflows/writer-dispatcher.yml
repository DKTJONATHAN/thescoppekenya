name: Writer Dispatcher (Kenya time)

# Single source of truth for content-writer schedules in Africa/Nairobi.
# Runs every 15 minutes during Kenya daytime (06:00–23:00 EAT),
# converts to EAT, and workflow_dispatch-es each writer that is due.
# Writers keep workflow_dispatch only (no schedule).
#
# za-news.yml  → every hour while dispatcher is active (06–23 EAT)
# entertainment desks → 4× daytime EAT
# daily desks → staggered morning–afternoon EAT

on:
  schedule:
    # Every 15 minutes, 03:00–20:00 UTC = 06:00–23:00 EAT (UTC+3)
    - cron: '0,15,30,45 3-20 * * *'
  workflow_dispatch:
    inputs:
      force_workflow:
        description: "Force one workflow file (e.g. za-news.yml). Empty = normal schedule."
        required: false
        default: ""
      force_all:
        description: "If true, dispatch ALL content writers once (ignore schedule)"
        required: false
        default: "false"
      dry_run:
        description: "If true, only print what would fire (no triggers)"
        required: false
        default: "false"

concurrency:
  group: writer-dispatcher
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

env:
  TZ: Africa/Nairobi

jobs:
  dispatch:
    runs-on: ubuntu-22.04
    steps:
      - name: Decide which writers to fire (EAT)
        id: plan
        env:
          FORCE: ${{ inputs.force_workflow }}
          FORCE_ALL: ${{ inputs.force_all }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          EAT_H=$(TZ=Africa/Nairobi date +%H)
          EAT_M=$(TZ=Africa/Nairobi date +%M)
          EAT_DOW=$(TZ=Africa/Nairobi date +%u)   # 1=Mon … 7=Sun
          EAT_NOW=$(TZ=Africa/Nairobi date '+%Y-%m-%d %H:%M %Z')
          echo "Now EAT: $EAT_NOW (dow=$EAT_DOW)"

          H=$((10#$EAT_H))
          M=$((10#$EAT_M))

          # Hard guard: only 06:00–23:00 EAT (matches cron window)
          if [ -z "${FORCE:-}" ] && [ "${FORCE_ALL:-false}" != "true" ]; then
            if [ "$H" -lt 6 ] || [ "$H" -gt 23 ]; then
              echo "Outside Kenya active window (06:00–23:00 EAT). Skipping."
              echo "count=0" >> "$GITHUB_OUTPUT"
              echo "list=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # Match if current time is within ±12 minutes of target (handles GH cron lag)
          within() {
            local target_h=$1 target_m=$2
            local cur_h=$((10#$EAT_H)) cur_m=$((10#$EAT_M))
            local t=$((target_h * 60 + target_m))
            local c=$((cur_h * 60 + cur_m))
            local d=$(( t > c ? t - c : c - t ))
            local d2=$(( 1440 - d ))
            [ "$d" -le 12 ] || [ "$d2" -le 12 ]
          }

          TO_FIRE=()

          ALL_WRITERS=(
            "za-news.yml"
            "za-ghafla.yml"
            "za-mpasho.yml"
            "za Entertainment.yml"
            "za africa.yml"
            "za agriculture.yml"
            "za business.yml"
            "za lifestyle.yml"
            "za opinions.yml"
            "za sports.yml"
            "za technology.yml"
            "za diano.yml"
            "za jaj.yml"
          )

          if [ "${FORCE_ALL:-false}" = "true" ]; then
            TO_FIRE=("${ALL_WRITERS[@]}")
            echo "Force-all mode: ${#TO_FIRE[@]} writers"
          elif [ -n "${FORCE:-}" ]; then
            TO_FIRE+=("$FORCE")
            echo "Force mode: $FORCE"
          else
            # ── Celestine news: every hour 06–23 EAT ──
            # Fire in the first 14 minutes of each hour
            if [ "$M" -le 14 ]; then
              TO_FIRE+=("za-news.yml")
              echo "News due (hourly 06–23 EAT) hour=$H"
            fi

            # ── Ghafla 4× EAT: 07:00 11:00 15:00 19:00 ──
            for hm in "7:0" "11:0" "15:0" "19:0"; do
              IFS=: read -r th tm <<<"$hm"
              if within "$th" "$tm"; then TO_FIRE+=("za-ghafla.yml"); break; fi
            done

            # ── Mpasho 4× EAT: 07:30 11:30 15:30 19:30 ──
            for hm in "7:30" "11:30" "15:30" "19:30"; do
              IFS=: read -r th tm <<<"$hm"
              if within "$th" "$tm"; then TO_FIRE+=("za-mpasho.yml"); break; fi
            done

            # ── Mutheu Entertainment 4× EAT: 08:00 12:00 16:00 20:00 ──
            for hm in "8:0" "12:0" "16:0" "20:0"; do
              IFS=: read -r th tm <<<"$hm"
              if within "$th" "$tm"; then TO_FIRE+=("za Entertainment.yml"); break; fi
            done

            # ── Daily desks (staggered EAT, twice daily) ──
            DAILY_ROWS=(
              "za africa.yml|6:15|18:15"
              "za agriculture.yml|7:15|17:15"
              "za business.yml|8:15|16:15"
              "za lifestyle.yml|9:15|15:15"
              "za opinions.yml|10:15|14:15"
              "za sports.yml|11:15|19:15"
              "za technology.yml|12:15|18:45"
              "za diano.yml|13:15|20:15"
            )
            for row in "${DAILY_ROWS[@]}"; do
              IFS='|' read -r wf hm1 hm2 <<<"$row"
              IFS=: read -r th tm <<<"$hm1"
              if within "$th" "$tm"; then TO_FIRE+=("$wf"); continue; fi
              if [ -n "${hm2:-}" ]; then
                IFS=: read -r th tm <<<"$hm2"
                if within "$th" "$tm"; then TO_FIRE+=("$wf"); fi
              fi
            done

            # ── Jaj column: Mon + Thu 11:20 and 17:20 EAT ──
            if [ "$EAT_DOW" = "1" ] || [ "$EAT_DOW" = "4" ]; then
              if within 11 20 || within 17 20; then
                TO_FIRE+=("za jaj.yml")
              fi
            fi
          fi

          # Dedupe preserve order
          UNIQUE=()
          seen="|"
          for w in "${TO_FIRE[@]+"${TO_FIRE[@]}"}"; do
            case "$seen" in
              *"|$w|"*) ;;
              *) UNIQUE+=("$w"); seen="${seen}${w}|" ;;
            esac
          done

          if [ "${#UNIQUE[@]}" -eq 0 ]; then
            echo "No writers due at this EAT slot."
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "list=" >> "$GITHUB_OUTPUT"
          else
            echo "Due: ${UNIQUE[*]}"
            echo "count=${#UNIQUE[@]}" >> "$GITHUB_OUTPUT"
            printf '%s\n' "${UNIQUE[@]}" > /tmp/due_workflows.txt
            echo "list<<EOF" >> "$GITHUB_OUTPUT"
            cat /tmp/due_workflows.txt >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "## Writer Dispatcher"
            echo "**EAT now:** $EAT_NOW"
            if [ "${#UNIQUE[@]}" -eq 0 ]; then
              echo "No workflows due."
            else
              echo "Triggering **${#UNIQUE[@]}** workflow(s):"
              for w in "${UNIQUE[@]}"; do echo "- \`$w\`"; done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger due workflows
        if: steps.plan.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DRY: ${{ inputs.dry_run }}
          LIST: ${{ steps.plan.outputs.list }}
        run: |
          set -euo pipefail

          echo "$LIST" > /tmp/due_workflows.txt
          ok=0
          fail=0
          while IFS= read -r wf; do
            [ -z "$wf" ] && continue
            if [ "${DRY:-false}" = "true" ]; then
              echo "DRY RUN — would trigger: $wf"
              continue
            fi
            echo "Dispatching: $wf"
            if gh workflow run "$wf" --repo "$GH_REPO" --ref main; then
              echo "  OK: $wf"
              ok=$((ok+1))
            else
              echo "  FAILED: $wf"
              fail=$((fail+1))
              gh workflow list --repo "$GH_REPO" 2>/dev/null | head -50 || true
            fi
            sleep 3
          done < /tmp/due_workflows.txt
          echo "Done. ok=$ok fail=$fail"
          echo "ok=$ok fail=$fail" >> "$GITHUB_STEP_SUMMARY"
