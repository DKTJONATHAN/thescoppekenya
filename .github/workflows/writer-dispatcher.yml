name: Writer Dispatcher (Kenya time)

# Single source of truth for content-writer schedules in Africa/Nairobi.
# Runs every 15 minutes (UTC), converts to EAT, and workflow_dispatch-es
# each writer that is due. Writers keep workflow_dispatch only (no schedule).

on:
  schedule:
    # Every 15 minutes — fine enough for :00/:15/:30/:45 and near-miss slots
    - cron: '0,15,30,45 * * * *'
  workflow_dispatch:
    inputs:
      force_workflow:
        description: "Optional: force one workflow file (e.g. za-news.yml). Leave empty for normal schedule match."
        required: false
        default: ""
      dry_run:
        description: "If true, only print what would fire (no triggers)"
        required: false
        default: "false"

concurrency:
  group: writer-dispatcher
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

env:
  TZ: Africa/Nairobi

jobs:
  dispatch:
    runs-on: ubuntu-22.04
    steps:
      - name: Decide which writers to fire (EAT)
        id: plan
        env:
          FORCE: ${{ inputs.force_workflow }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          # Kenya time (Africa/Nairobi, UTC+3, no DST)
          EAT_H=$(TZ=Africa/Nairobi date +%H)
          EAT_M=$(TZ=Africa/Nairobi date +%M)
          EAT_DOW=$(TZ=Africa/Nairobi date +%u)   # 1=Mon … 7=Sun
          EAT_NOW=$(TZ=Africa/Nairobi date '+%Y-%m-%d %H:%M %Z')
          echo "Now EAT: $EAT_NOW (dow=$EAT_DOW)"

          # Window: match if target minute is within ±7 of current minute
          within() {
            local target_h=$1 target_m=$2
            local cur_h=$((10#$EAT_H)) cur_m=$((10#$EAT_M))
            local t=$((target_h * 60 + target_m))
            local c=$((cur_h * 60 + cur_m))
            local d=$(( t > c ? t - c : c - t ))
            local d2=$(( 1440 - d ))
            [ "$d" -le 7 ] || [ "$d2" -le 7 ]
          }

          TO_FIRE=()

          if [ -n "${FORCE:-}" ]; then
            TO_FIRE+=("$FORCE")
            echo "Force mode: $FORCE"
          else
            # Celestine news: every hour 06:00–23:00 EAT (fires on :00 tick)
            H=$((10#$EAT_H))
            M=$((10#$EAT_M))
            if [ "$H" -ge 6 ] && [ "$H" -le 23 ] && [ "$M" -le 7 ]; then
              TO_FIRE+=("za-news.yml")
            fi

            # Ghafla 4× 07:00 11:00 15:00 19:00
            for hm in "7:0" "11:0" "15:0" "19:0"; do
              IFS=: read -r th tm <<<"$hm"
              if within "$th" "$tm"; then TO_FIRE+=("za-ghafla.yml"); break; fi
            done

            # Mpasho 4× 07:45 11:45 15:45 19:45
            for hm in "7:45" "11:45" "15:45" "19:45"; do
              IFS=: read -r th tm <<<"$hm"
              if within "$th" "$tm"; then TO_FIRE+=("za-mpasho.yml"); break; fi
            done

            # Mutheu Entertainment 4× 08:30 12:30 16:30 20:30
            for hm in "8:30" "12:30" "16:30" "20:30"; do
              IFS=: read -r th tm <<<"$hm"
              if within "$th" "$tm"; then TO_FIRE+=("za Entertainment.yml"); break; fi
            done

            # Daily single slots (EAT)
            DAILY_WF=(
              "za africa.yml"
              "za agriculture.yml"
              "za business.yml"
              "za lifestyle.yml"
              "za opinions.yml"
              "za sports.yml"
              "za technology.yml"
              "za diano.yml"
            )
            DAILY_HM=(
              "6:8"
              "7:9"
              "8:10"
              "10:14"
              "12:17"
              "13:19"
              "14:20"
              "15:11"
            )
            for i in "${!DAILY_WF[@]}"; do
              IFS=: read -r th tm <<<"${DAILY_HM[$i]}"
              if within "$th" "$tm"; then TO_FIRE+=("${DAILY_WF[$i]}"); fi
            done

            # Jaj column: Mon + Thu 11:13 EAT
            if { [ "$EAT_DOW" = "1" ] || [ "$EAT_DOW" = "4" ]; } && within 11 13; then
              TO_FIRE+=("za jaj.yml")
            fi
          fi

          # Dedupe
          UNIQUE=()
          seen="|"
          for w in "${TO_FIRE[@]+"${TO_FIRE[@]}"}"; do
            case "$seen" in
              *"|$w|"*) ;;
              *) UNIQUE+=("$w"); seen="${seen}${w}|" ;;
            esac
          done

          if [ "${#UNIQUE[@]}" -eq 0 ]; then
            echo "No writers due at this EAT slot."
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "list=" >> "$GITHUB_OUTPUT"
          else
            echo "Due: ${UNIQUE[*]}"
            echo "count=${#UNIQUE[@]}" >> "$GITHUB_OUTPUT"
            printf '%s\n' "${UNIQUE[@]}" > /tmp/due_workflows.txt
            echo "list<<EOF" >> "$GITHUB_OUTPUT"
            cat /tmp/due_workflows.txt >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "## Writer Dispatcher"
            echo "**EAT now:** $EAT_NOW"
            if [ "${#UNIQUE[@]}" -eq 0 ]; then
              echo "No workflows due."
            else
              echo "Triggering:"
              for w in "${UNIQUE[@]}"; do echo "- \`$w\`"; done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger due workflows
        if: steps.plan.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DRY: ${{ inputs.dry_run }}
          LIST: ${{ steps.plan.outputs.list }}
        run: |
          set -euo pipefail

          # gh needs an explicit repo — this job does not checkout the workspace,
          # so without --repo it fails with: fatal: not a git repository
          echo "$LIST" > /tmp/due_workflows.txt
          while IFS= read -r wf; do
            [ -z "$wf" ] && continue
            if [ "${DRY:-false}" = "true" ]; then
              echo "DRY RUN — would trigger: $wf"
              continue
            fi
            echo "Dispatching: $wf"
            if gh workflow run "$wf" --repo "$GH_REPO" --ref main; then
              echo "  OK: $wf"
            else
              echo "  FAILED: $wf (check workflow_dispatch is enabled and filename matches Actions)"
              # list matching workflows to help debug name/path issues
              gh workflow list --repo "$GH_REPO" | head -40 || true
            fi
            sleep 2
          done < /tmp/due_workflows.txt
