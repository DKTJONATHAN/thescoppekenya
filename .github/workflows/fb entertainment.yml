name: Facebook Article-Blast (Entertainment)

on:
  push:
    branches: [main]
    paths:
      - 'content/posts/**.md'
  workflow_dispatch:
    inputs:
      force_latest:
        description: 'Post newest entertainment article even if already blasted'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: facebook-article-blast-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post-to-facebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 20
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Wait for deploy
        run: |
          echo "Waiting 45s for deploy..."
          sleep 45

      - name: Detect entertainment posts and publish article preview
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FORCE_LATEST: ${{ github.event.inputs.force_latest || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -e
          if [ -z "$FACEBOOK_PAGE_ID" ] || [ -z "$FACEBOOK_PAGE_TOKEN" ]; then
            echo "Facebook credentials not set, skipping"
            exit 0
          fi

          CHANGED=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            CHANGED=$(ls -1t content/posts/*.md 2>/dev/null | head -8 || true)
          else
            if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
              CHANGED=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- 'content/posts/' | grep '\.md$' || true)
            fi
            if [ -z "$CHANGED" ]; then
              CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'content/posts/' 2>/dev/null | grep '\.md$' || true)
            fi
            if [ -z "$CHANGED" ]; then
              CHANGED=$(git log -1 --name-only --pretty=format: -- 'content/posts/' | grep '\.md$' || true)
            fi
          fi

          if [ -z "$CHANGED" ]; then
            echo "No post changes detected"
            exit 0
          fi

          export CHANGED_FILES="$CHANGED"
          echo "Candidates:"
          echo "$CHANGED_FILES"

          python3 << 'PY'
          import hashlib, json, os, re, time
          from pathlib import Path
          import requests

          SITE = "https://zandani.co.ke"
          MEM = Path(".github/memory_facebook_article_blast.json")
          IMG = Path("temp_fb_article_image.jpg")
          MAX_N = 2
          MAX_MSG = 2200
          ENT_CATS = {
              "entertainment", "music", "gossip", "celebrity", "celebrities",
              "africa entertainment", "showbiz", "lifestyle entertainment",
          }

          page_id = os.environ["FACEBOOK_PAGE_ID"]
          token = os.environ["FACEBOOK_PAGE_TOKEN"]
          force = os.environ.get("FORCE_LATEST", "false").lower() == "true"

          def load_mem():
              if MEM.exists():
                  try:
                      d = json.loads(MEM.read_text(encoding="utf-8"))
                      return {"posted": d if isinstance(d, list) else d.get("posted", [])}
                  except Exception:
                      pass
              return {"posted": []}

          def save_mem(m):
              MEM.parent.mkdir(parents=True, exist_ok=True)
              m["posted"] = list(m.get("posted", []))[-400:]
              MEM.write_text(json.dumps(m, indent=2), encoding="utf-8")

          def field(content, name, default=""):
              m = re.search(rf'^{name}:\s*["\']?(.*?)["\']?\s*$', content, re.M)
              return (m.group(1).strip() if m else default).strip()

          def strip_fm(text):
              text = text.strip()
              if text.startswith("---"):
                  end = text.find("---", 3)
                  if end != -1:
                      return text[end + 3:].strip()
              return text

          def extract_paragraphs(body, count=3):
              body = re.sub(r"!\[.*?\]\(.*?\)", "", body)
              body = re.sub(r"\[([^\]]+)\]\([^)]+\)", r"\1", body)
              body = re.sub(r"<[^>]+>", "", body)
              body = re.sub(r"^[-*_]{3,}\s*$", "", body, flags=re.M)

              # Prefer blank-line separated blocks, then fall back line by line
              blocks = re.split(r"\n\s*\n", body)
              paragraphs = []
              for block in blocks:
                  lines = []
                  for line in block.split("\n"):
                      line = line.strip()
                      if not line:
                          continue
                      if line.startswith(("#", ">", "-", "*", "+", "`", "|")):
                          continue
                      if re.match(r"^\d+\.", line):
                          continue
                      lines.append(line)
                  if not lines:
                      continue
                  para = " ".join(lines)
                  para = re.sub(r"\s+", " ", para).strip()
                  if len(para) < 40:
                      continue
                  paragraphs.append(para)
                  if len(paragraphs) >= count:
                      break

              if len(paragraphs) < count:
                  for line in body.split("\n"):
                      line = line.strip()
                      if not line or line.startswith(("#", ">", "-", "*", "+", "`", "|")):
                          continue
                      if re.match(r"^\d+\.", line):
                          continue
                      if len(line) < 40:
                          continue
                      if line not in paragraphs:
                          paragraphs.append(line)
                      if len(paragraphs) >= count:
                          break

              return "\n\n".join(paragraphs[:count])

          def is_entertainment(category, tags_raw=""):
              cat = (category or "").strip().lower()
              if cat in ENT_CATS:
                  return True
              if "entertainment" in cat or "gossip" in cat or "celebrity" in cat:
                  return True
              tags = re.findall(r"[A-Za-z][\w\s-]*", tags_raw or "")
              tag_l = {t.strip().lower() for t in tags}
              return bool(tag_l & {"entertainment", "gossip", "celebrity", "celebrities", "music", "showbiz"})

          def phash(slug, title):
              return hashlib.md5(f"article|{slug}|{title}".encode()).hexdigest()

          def live_ok(url):
              for i in range(6):
                  try:
                      r = requests.get(url, timeout=12, allow_redirects=True)
                      if r.status_code == 200 and len(r.text) > 500:
                          return True
                  except Exception as e:
                      print(f"live check {i+1}: {e}")
                  time.sleep(8)
              return False

          def build_message(title, preview):
              msg = (
                  f"{title}\n\n"
                  f"{preview}\n\n"
                  f"Full story is in the comments.\n"
                  f"#Kenya #Entertainment #ZaNdani"
              )
              msg = msg.replace("\u2014", "-").replace("\u2013", "-")
              if len(msg) > MAX_MSG:
                  # Keep title + truncated preview + CTA
                  budget = MAX_MSG - len(title) - 80
                  cut = preview[: max(200, budget)]
                  cut = cut.rsplit(" ", 1)[0] + "..."
                  msg = (
                      f"{title}\n\n"
                      f"{cut}\n\n"
                      f"Full story is in the comments.\n"
                      f"#Kenya #Entertainment #ZaNdani"
                  )
              return msg

          def fb_post(caption, image_url):
              has_img = False
              if image_url.startswith("http"):
                  try:
                      r = requests.get(image_url, timeout=20)
                      r.raise_for_status()
                      IMG.write_bytes(r.content)
                      has_img = True
                  except Exception as e:
                      print(f"img fail: {e}")
              result = {}
              post_id = None
              if has_img:
                  with IMG.open("rb") as fh:
                      result = requests.post(
                          f"https://graph.facebook.com/v21.0/{page_id}/photos",
                          data={"message": caption, "access_token": token},
                          files={"source": fh},
                          timeout=60,
                      ).json()
                  post_id = result.get("post_id") or result.get("id")
                  if post_id and "_" not in str(post_id):
                      post_id = f"{page_id}_{post_id}"
              else:
                  result = requests.post(
                      f"https://graph.facebook.com/v21.0/{page_id}/feed",
                      data={"message": caption, "access_token": token},
                      timeout=40,
                  ).json()
                  post_id = result.get("id")
              if IMG.exists():
                  IMG.unlink(missing_ok=True)
              return post_id, result

          def comment(post_id, msg):
              return requests.post(
                  f"https://graph.facebook.com/v21.0/{post_id}/comments",
                  data={"message": msg, "access_token": token},
                  timeout=30,
              ).json()

          mem = load_mem()
          done = set(mem.get("posted", []))
          paths = [p.strip() for p in os.environ.get("CHANGED_FILES", "").splitlines() if p.strip().endswith(".md") and Path(p.strip()).exists()]
          paths = sorted(paths, key=lambda p: Path(p).stat().st_mtime, reverse=True)

          n = 0
          for path in paths:
              if n >= MAX_N:
                  break
              raw = Path(path).read_text(encoding="utf-8")
              slug = field(raw, "slug") or Path(path).stem
              if re.match(r"^\d{4}-\d{2}-\d{2}-", slug) and not field(raw, "slug"):
                  slug = re.sub(r"^\d{4}-\d{2}-\d{2}-", "", slug)
              title = field(raw, "title", "Latest from Za Ndani")
              author = field(raw, "author", "Za Ndani")
              image_url = field(raw, "image")
              category = field(raw, "category")
              tags = field(raw, "tags")
              if not is_entertainment(category, tags):
                  print(f"Skip non-entertainment: {title} ({category})")
                  continue

              url = f"{SITE}/article/{slug}"
              h = phash(slug, title)
              if h in done and not force:
                  print(f"Skip already blasted: {slug}")
                  continue

              print(f"Processing: {title} -> {url}")
              if not live_ok(url):
                  print(f"Not live yet, posting anyway: {url}")

              preview = extract_paragraphs(strip_fm(raw), count=3)
              if not preview:
                  excerpt = field(raw, "excerpt") or field(raw, "description") or title
                  preview = excerpt

              message = build_message(title, preview)
              post_id, api = fb_post(message, image_url)
              print(f"FB: {api}")
              if not post_id:
                  print(f"FAILED {slug}")
                  continue

              time.sleep(8)
              cmsg = f"Full story by {author}:\n{url}"
              cres = comment(post_id, cmsg)
              print(f"Comment: {cres}")
              if "error" in cres:
                  alts = []
                  if "_" in str(post_id):
                      alts.append(str(post_id).split("_", 1)[-1])
                  else:
                      alts.append(f"{page_id}_{post_id}")
                  for alt in alts:
                      time.sleep(3)
                      cres = comment(alt, cmsg)
                      print(f"Comment retry {alt}: {cres}")
                      if "error" not in cres:
                          break

              done.add(h)
              mem["posted"] = list(done)
              n += 1
              print(f"Published article blast for {slug}")
              time.sleep(5)

          save_mem(mem)
          print(f"Done. Published {n} entertainment preview(s).")
          PY

      - name: Persist article blast memory
        if: always()
        run: |
          if [ ! -f .github/memory_facebook_article_blast.json ]; then
            echo "No memory file"
            exit 0
          fi
          git config user.name "Za Ndani"
          git config user.email "bot@zandani.co.ke"
          git add .github/memory_facebook_article_blast.json
          git diff --staged --quiet && echo "No memory changes" && exit 0
          git commit -m "chore(facebook): update article blast memory [skip ci]" || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true
